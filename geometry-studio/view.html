<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16364b">
<meta name="description" content="Перегляд креслення Geometry Studio за посиланням">
<title>Geometry Studio — перегляд креслення</title>
<style>
:root{color-scheme:light;font-family:Inter,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#e8f0f6;color:#18384e;min-height:100dvh}
header{position:sticky;z-index:10;top:0;background:#16364b;color:#fff;display:flex;align-items:center;gap:15px;justify-content:space-between;padding:14px max(17px,calc((100vw - 1240px)/2))}
h1{font-size:19px;margin:4px 0 0}header small{font-size:10px;letter-spacing:1.5px;color:#9cc8d4}
nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a.action{cursor:pointer;border:1px solid #afc9d8;background:#fff;border-radius:8px;padding:10px 13px;color:#204b64;font-weight:700;font-size:12px;text-decoration:none}
button:disabled{opacity:.45;cursor:default}a.action{background:#2e586b;color:#fff;border-color:#52748a}
#status{max-width:900px;margin:15px auto;padding:13px 18px;font-size:13px;color:#486678;text-align:center}
#status.error{color:#b33e4a}
#stage{position:relative;overflow:auto;min-height:calc(100dvh - 145px);display:flex;align-items:flex-start;justify-content:center;padding:25px}
#drawing{display:block;max-width:100%;background:white;border:1px solid #c6d5e0;box-shadow:0 14px 50px #0a294332;transform-origin:top center;transition:transform .12s ease;object-fit:contain}
#drawing[hidden]{display:none}
.toolbar{position:fixed;bottom:20px;right:20px;display:flex;gap:4px;align-items:center;border:1px solid #c9d8e2;border-radius:12px;padding:7px;background:#ffffffee;box-shadow:0 5px 26px #0a314b24;z-index:11}
.toolbar button{padding:9px 13px}.toolbar span{font-size:12px;min-width:52px;text-align:center;color:#456578}
@media(max-width:700px){header{flex-direction:column;align-items:flex-start}h1{font-size:16px}#stage{padding:8px}.toolbar{right:8px;bottom:8px}}
</style>
<script defer src="cloud-config.js?v=cloud1"></script>
</head>
<body>
<header>
 <div><small>GEOMETRY STUDIO · СПІЛЬНИЙ ПЕРЕГЛЯД</small><h1 id="title">Креслення</h1></div>
 <nav><button id="saveSvg" disabled>↓ SVG</button><button id="savePng" disabled>↓ PNG</button><button id="openCopy" disabled title="Створити власну редаговану копію креслення">Редагувати копію</button><a class="action" href="./">Новий аркуш</a></nav>
</header>
<div id="status" role="status">Завантаження креслення…</div>
<main id="stage"><img id="drawing" alt="Креслення Geometry Studio — лише перегляд" hidden></main>
<div class="toolbar"><button id="minus" aria-label="Зменшити">−</button><span id="percent">100%</span><button id="plus" aria-label="Збільшити">+</button><button id="fit">Скинути</button></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let svg='',blobUrl='',scale=1,sharedId='';
function message(text,bad=false){$('status').textContent=text;$('status').classList.toggle('error',bad);}
function download(blob,name){
 const a=document.createElement('a'),url=URL.createObjectURL(blob);
 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function zoom(value){
 scale=Math.min(4,Math.max(.5,value));$('drawing').style.transform='scale('+scale+')';
 $('percent').textContent=Math.round(scale*100)+'%';
}
async function load(){
 const share=new URLSearchParams(location.search).get('share')||'';
 if(!/^[a-f0-9-]{36}$/i.test(share)){message('Посилання для перегляду неправильне.',true);return;}
 const configured=String(window.GeometryStudioCloudConfig?.apiBase||localStorage.getItem('geometry-studio-worker-url')||'').replace(/\/+$/,'');
 if(!configured){message('Хмарний перегляд ще не підключено власником сайту.',true);return;}
 try{
  const response=await fetch(configured+'/api/share/'+encodeURIComponent(share),{cache:'no-store'});
  const result=await response.json();
  if(!response.ok)throw Error(result.error||'Креслення недоступне.');
  if(typeof result.svg!=='string'||!result.svg.trimStart().startsWith('<svg'))throw Error('Некоректне креслення.');
  svg=result.svg;
  sharedId=share;
  blobUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  $('drawing').src=blobUrl;
  $('drawing').hidden=false;
  $('title').textContent=result.title||'Креслення';
  document.title=($('title').textContent)+' — Geometry Studio';
  $('saveSvg').disabled=false;$('savePng').disabled=false;$('openCopy').disabled=false;
  message('Можна створити власну редаговану копію. Оригінал автора не зміниться.');
 }catch(e){message(e.message||'Не вдалося завантажити креслення.',true);}
}
$('openCopy').onclick=()=>{
 if(!sharedId)return;
 const url=new URL('./',location.href);
 url.searchParams.set('copy',sharedId);
 location.assign(url.href);
};
$('minus').onclick=()=>zoom(scale/1.2);
$('plus').onclick=()=>zoom(scale*1.2);
$('fit').onclick=()=>zoom(1);
$('saveSvg').onclick=()=>{if(svg)download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),'geometry-studio-shared.svg');};
$('savePng').onclick=async()=>{
 if(!svg)return;
 try{
  const image=new Image(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url;});
  const dpi=200,canvas=document.createElement('canvas');
  canvas.width=Math.round(297*dpi/25.4);canvas.height=Math.round(420*dpi/25.4);
  const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);
  canvas.toBlob(blob=>{if(blob)download(blob,'geometry-studio-shared.png');},'image/png');
 }catch(_){message('Не вдалося створити PNG.',true);}
};
window.addEventListener('beforeunload',()=>{if(blobUrl)URL.revokeObjectURL(blobUrl);});
document.addEventListener('DOMContentLoaded',load);
})();
</script>
</body>
</html>
